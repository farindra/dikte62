  </defs>

  <!-- latar -->
  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>

  <!-- motif kawung (batik) -->
  <g fill="#FFFFFF" opacity="0.055">
    <circle cx="188" cy="188" r="52"/>
    <circle cx="836" cy="188" r="52"/>
    <circle cx="188" cy="836" r="52"/>
    <circle cx="836" cy="836" r="52"/>
    <circle cx="512" cy="120" r="34"/>
    <circle cx="512" cy="904" r="34"/>
  </g>

  <!-- bahu -->
  <path d="M292 844c0-142 96-214 220-214s220 72 220 214z" fill="url(#face)"/>

  <!-- leher -->
  <rect x="462" y="596" width="100" height="84" rx="30" fill="#D8DFF1"/>

  <!-- kepala -->
  <circle cx="512" cy="486" r="152" fill="url(#face)"/>

  <!-- peci (songkok) -->
  <g>
    <path d="M396 304h232q16 0 19 15l14 52q3 12-9 12H372q-12 0-9-12l14-52q3-15 19-15z"
